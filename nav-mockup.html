<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DartEvent — Navigation Redesign Mockup</title>
<style>
:root {
  --pe-blue-deep:   #1A4FD6;
  --pe-blue-mid:    #1E7FEB;
  --pe-cyan-bright: #00B8FF;
  --pe-cyan-light:  #5DD5FF;
  --pe-gradient:    linear-gradient(135deg, #5DD5FF, #1E7FEB, #1A4FD6);
  --pe-bg:          #090E1A;
  --pe-bg-card:     #101829;
  --pe-bg-elevated: #172035;
  --pe-border:      #1E3154;
  --pe-text:        #FFFFFF;
  --pe-text-sub:    #A8BDD6;
  --pe-text-muted:  #5A7394;
  --pe-success:     #00E5A0;
  --pe-warning:     #FFB020;
  --pe-danger:      #FF4560;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #04070F;
  color: var(--pe-text);
  font-family: Verdana, Geneva, sans-serif;
  min-height: 100vh;
  padding: 24px 16px 48px;
}

/* ─── PAGE LAYOUT ─── */
.page-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.logo-pill {
  height: 44px;
  padding: 0 20px;
  background: var(--pe-gradient);
  border-radius: 12px;
  display: flex;
  align-items: center;
  font-size: 15px;
  font-weight: bold;
}
.page-header h1 { font-size: 20px; color: var(--pe-text); }
.page-header p  { font-size: 12px; color: var(--pe-text-muted); margin-top: 3px; }

/* ─── CONTROL PANEL ─── */
.controls {
  background: var(--pe-bg-card);
  border: 1px solid var(--pe-border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
}
.controls-title {
  font-size: 10px;
  color: var(--pe-text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 14px;
}
.ctrl-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}
.ctrl-row:last-child { margin-bottom: 0; }
.ctrl-label {
  font-size: 11px;
  color: var(--pe-text-muted);
  min-width: 56px;
}
.ctrl-btn {
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--pe-border);
  background: var(--pe-bg-elevated);
  color: var(--pe-text-sub);
  font-family: Verdana, Geneva, sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all 120ms;
}
.ctrl-btn:hover:not(.active) { color: var(--pe-text); border-color: var(--pe-text-muted); }
.ctrl-btn.active {
  background: var(--pe-blue-deep);
  color: var(--pe-text);
  border-color: var(--pe-blue-mid);
}

/* ─── FRAMES WRAPPER ─── */
.frames {
  display: flex;
  gap: 32px;
  align-items: flex-start;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

/* ─── MOBILE FRAME ─── */
.frame-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.frame-label {
  font-size: 10px;
  color: var(--pe-text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.mobile-frame {
  width: 390px;
  height: 844px;
  background: var(--pe-bg);
  border-radius: 50px;
  border: 10px solid #111827;
  box-shadow: 0 0 0 2px #1e2a40, 0 40px 100px rgba(0,0,0,0.85), inset 0 0 0 1px #0a1220;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
/* notch */
.mobile-frame::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 30px;
  background: #111827;
  border-radius: 0 0 20px 20px;
  z-index: 20;
}

/* ─── DESKTOP FRAME ─── */
.desktop-frame {
  background: var(--pe-bg);
  border-radius: 14px;
  border: 2px solid var(--pe-border);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 560px;
  flex: 1;
  min-width: 600px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

/* ─── TOPBAR ─── */
.topbar {
  height: 64px;
  background: var(--pe-bg-elevated);
  border-bottom: 1px solid var(--pe-border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
  z-index: 5;
}
.topbar-logo {
  height: 30px;
  padding: 0 12px;
  background: var(--pe-gradient);
  border-radius: 8px;
  display: flex;
  align-items: center;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}
.topbar-back {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--pe-text-sub);
  font-size: 20px;
  cursor: pointer;
  border-radius: 8px;
  margin-left: -8px;
}
.topbar-spacer { flex: 1; }
.topbar-title {
  font-size: 14px;
  font-weight: bold;
  color: var(--pe-text);
}
.role-pill {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: bold;
}
.topbar-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--pe-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

/* ─── DESKTOP TOP NAV ─── */
.desktop-topnav {
  background: var(--pe-bg-card);
  border-bottom: 1px solid var(--pe-border);
  display: flex;
  align-items: stretch;
  gap: 0;
  padding: 0 8px;
  height: 48px;
  flex-shrink: 0;
  overflow-x: auto;
}
.desktop-navitem {
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: bold;
  color: var(--pe-text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all 120ms;
  height: 100%;
}
.desktop-navitem.active {
  color: var(--pe-cyan-bright);
  border-bottom-color: var(--pe-cyan-bright);
}
.desktop-navitem:hover:not(.active) { color: var(--pe-text-sub); }

/* ─── MOBILE BOTTOM NAV ─── */
.mobile-bottomnav {
  height: 82px;
  background: var(--pe-bg-elevated);
  border-top: 1px solid var(--pe-border);
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
}
.mobile-navitem {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  position: relative;
  padding-bottom: 10px;
}
.mobile-navitem.active::after {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  background: var(--pe-cyan-bright);
  border-radius: 0 0 3px 3px;
}
.mobile-navitem.active .m-icon { color: var(--pe-cyan-bright); }
.mobile-navitem.active .m-label { color: var(--pe-cyan-bright); }
.mobile-navitem:not(.active) .m-icon { color: var(--pe-text-muted); }
.mobile-navitem:not(.active) .m-label { color: var(--pe-text-muted); }
.m-icon { font-size: 22px; line-height: 1; }
.m-label { font-size: 10px; font-weight: bold; }

/* ─── CONTENT AREA ─── */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  background: var(--pe-bg);
  scrollbar-width: none;
}
.content-area::-webkit-scrollbar { display: none; }
.content-pb { padding-bottom: 100px; }

/* ─── MOCK CARDS ─── */
.mock-card {
  background: var(--pe-bg-card);
  border: 1px solid var(--pe-border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
}
.mock-card h3 { font-size: 15px; color: var(--pe-text); margin-bottom: 6px; }
.mock-card p  { font-size: 12px; color: var(--pe-text-sub); line-height: 1.5; }
.shimmer {
  height: 13px;
  border-radius: 6px;
  background: var(--pe-bg-elevated);
  margin-bottom: 8px;
}
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: bold;
}

/* ─── REFEREE BOARD ─── */
.ref-board {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--pe-bg);
  position: relative;
}
.ref-no-nav-tag {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 9px;
  color: var(--pe-warning);
  background: rgba(255,176,32,0.1);
  border: 1px solid rgba(255,176,32,0.3);
  border-radius: 6px;
  padding: 3px 8px;
  font-weight: bold;
  z-index: 5;
}
.ref-scores {
  background: var(--pe-bg-card);
  border-bottom: 1px solid var(--pe-border);
  padding: 16px;
  display: flex;
  justify-content: space-around;
  align-items: center;
}
.ref-score-block { text-align: center; }
.ref-player-name { font-size: 11px; color: var(--pe-text-muted); margin-bottom: 4px; }
.ref-score-big {
  font-size: 52px;
  font-weight: bold;
  background: var(--pe-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}
.ref-score-big.dim {
  background: none;
  -webkit-text-fill-color: var(--pe-text-muted);
}
.ref-score-label { font-size: 10px; color: var(--pe-text-muted); text-transform: uppercase; margin-top: 4px; }
.ref-turn-bar {
  padding: 8px 16px;
  background: var(--pe-bg-elevated);
  border-bottom: 1px solid var(--pe-border);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
}
.ref-turn-label { font-size: 11px; color: var(--pe-text-muted); }
.ref-turn-name  { font-size: 13px; font-weight: bold; color: var(--pe-cyan-bright); }
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 14px;
  flex: 1;
}
.np-btn {
  background: var(--pe-bg-elevated);
  border: 1px solid var(--pe-border);
  border-radius: 12px;
  color: var(--pe-text);
  font-size: 22px;
  font-weight: bold;
  font-family: Verdana, Geneva, sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60px;
}
.np-btn.confirm { background: var(--pe-blue-deep); border-color: var(--pe-blue-mid); }
.np-btn.undo    { background: rgba(255,69,96,0.12); border-color: var(--pe-danger); color: var(--pe-danger); }
.ref-exit {
  text-align: center;
  padding: 8px 0 12px;
  font-size: 10px;
  color: var(--pe-text-muted);
  opacity: 0.5;
  cursor: pointer;
}

/* ─── REFEREE PLAYER CARDS ─── */
.ref-player-cards {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  background: var(--pe-bg-card);
  border-bottom: 1px solid var(--pe-border);
}
.ref-player-card {
  flex: 1;
  border-radius: 10px;
  border: 2px solid var(--pe-border);
  padding: 10px 12px;
  transition: all 150ms;
  position: relative;
}
.ref-player-card.active {
  border-color: var(--pe-cyan-bright);
  background: rgba(0,184,255,0.06);
}
.ref-player-card.inactive { opacity: 0.45; }
.ref-card-name { font-size: 13px; font-weight: bold; color: var(--pe-text); margin-bottom: 4px; }
.ref-card-score { font-size: 30px; font-weight: bold; line-height: 1; margin-bottom: 6px; }
.ref-card-score.hi { background: var(--pe-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.ref-card-score.lo { color: var(--pe-text-muted); }
.ref-card-badges { display: flex; gap: 4px; flex-wrap: wrap; }
.ref-badge { font-size: 9px; font-weight: bold; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.ref-badge.anwurf  { background: rgba(255,176,32,0.15); color: var(--pe-warning);      border: 1px solid rgba(255,176,32,0.3);  }
.ref-badge.am-zug  { background: rgba(0,184,255,0.15);  color: var(--pe-cyan-bright);  border: 1px solid rgba(0,184,255,0.3);   }

/* ─── MODIFIER BAR ─── */
.ref-mod-bar {
  display: flex;
  gap: 6px;
  padding: 8px 10px;
  background: var(--pe-bg-elevated);
  border-bottom: 1px solid var(--pe-border);
}
.ref-mod-btn {
  flex: 1;
  height: 38px;
  border-radius: 8px;
  border: 1px solid var(--pe-border);
  background: var(--pe-bg-card);
  color: var(--pe-text-muted);
  font-family: Verdana, Geneva, sans-serif;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: all 120ms;
}
.ref-mod-btn.active {
  background: var(--pe-blue-deep);
  border-color: var(--pe-blue-mid);
  color: var(--pe-text);
}

/* ─── NUMBER GRID 1-20 ─── */
.ref-num-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  padding: 8px 10px 4px;
  background: var(--pe-bg);
}
.ref-num-btn {
  background: var(--pe-bg-elevated);
  border: 1px solid var(--pe-border);
  border-radius: 8px;
  color: var(--pe-text);
  font-size: 15px;
  font-weight: bold;
  font-family: Verdana, Geneva, sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
}

/* ─── SPECIAL ROW (Bull / D-Bull / Miss) ─── */
.ref-special-row {
  display: flex;
  gap: 5px;
  padding: 4px 10px;
  background: var(--pe-bg);
}
.ref-special-btn {
  flex: 1;
  min-height: 40px;
  border-radius: 8px;
  border: 1px solid var(--pe-border);
  background: var(--pe-bg-elevated);
  color: var(--pe-text-sub);
  font-family: Verdana, Geneva, sans-serif;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}
.ref-special-btn.miss {
  background: rgba(255,69,96,0.1);
  border-color: rgba(255,69,96,0.3);
  color: var(--pe-danger);
}

/* ─── ACTION ROW (Undo / display / Confirm) ─── */
.ref-action-row {
  display: flex;
  gap: 8px;
  padding: 5px 10px 8px;
  background: var(--pe-bg);
}
.ref-input-display {
  flex: 1;
  background: var(--pe-bg-elevated);
  border: 1px solid var(--pe-border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  color: var(--pe-cyan-bright);
  font-family: Verdana, Geneva, sans-serif;
}
.ref-act-btn {
  height: 50px;
  width: 58px;
  border-radius: 10px;
  border: 1px solid var(--pe-border);
  font-family: Verdana, Geneva, sans-serif;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
}
.ref-act-btn.undo    { background: rgba(255,69,96,0.1); border-color: rgba(255,69,96,0.3); color: var(--pe-danger); }
.ref-act-btn.confirm { background: var(--pe-blue-deep); border-color: var(--pe-blue-mid);  color: var(--pe-text); }

/* ─── BOARD QUEUE CHIP (access from score view) ─── */
.ref-queue-chip {
  position: absolute;
  top: 10px;
  left: 12px;
  background: rgba(0,184,255,0.1);
  border: 1px solid rgba(0,184,255,0.25);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 10px;
  font-weight: bold;
  color: var(--pe-cyan-bright);
  cursor: pointer;
  z-index: 5;
  white-space: nowrap;
}

/* ─── BOARD QUEUE SCREEN ─── */
.ref-queue-header {
  background: var(--pe-bg-card);
  border-bottom: 1px solid var(--pe-border);
  padding: 14px 14px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.ref-queue-back {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--pe-bg-elevated);
  border: 1px solid var(--pe-border);
  color: var(--pe-text-sub);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ref-queue-title { font-size: 14px; font-weight: bold; color: var(--pe-text); flex: 1; }
.ref-queue-list  { flex: 1; overflow-y: auto; padding: 12px; background: var(--pe-bg); }
.ref-game-card {
  background: var(--pe-bg-card);
  border: 1px solid var(--pe-border);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ref-game-card.current {
  border-color: var(--pe-cyan-bright);
  background: rgba(0,184,255,0.05);
}
.ref-game-card.missing {
  border-color: var(--pe-warning);
  background: rgba(255,176,32,0.05);
}
.ref-game-info   { flex: 1; min-width: 0; }
.ref-game-round  { font-size: 10px; color: var(--pe-text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
.ref-game-players { font-size: 13px; font-weight: bold; color: var(--pe-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref-game-status { font-size: 10px; margin-top: 4px; font-weight: bold; }
.ref-game-start {
  flex-shrink: 0;
  height: 38px;
  padding: 0 14px;
  border-radius: 8px;
  border: none;
  background: var(--pe-blue-deep);
  color: var(--pe-text);
  font-family: Verdana, Geneva, sans-serif;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}
.ref-game-start:disabled {
  background: var(--pe-bg-elevated);
  color: var(--pe-text-muted);
  border: 1px solid var(--pe-border);
  cursor: default;
}

/* ─── LOGIN SCREEN ─── */
.login-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  background: var(--pe-bg);
}
.login-logo {
  height: 52px;
  padding: 0 24px;
  background: var(--pe-gradient);
  border-radius: 14px;
  display: flex;
  align-items: center;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 16px;
}
.login-title { font-size: 18px; color: var(--pe-text); margin-bottom: 4px; }
.login-sub   { font-size: 12px; color: var(--pe-text-muted); margin-bottom: 28px; }
.login-form  { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
.fake-input  {
  background: var(--pe-bg-elevated);
  border: 1px solid var(--pe-border);
  border-radius: 10px;
  height: 52px;
  padding: 0 16px;
  color: var(--pe-text-muted);
  font-family: Verdana, Geneva, sans-serif;
  font-size: 13px;
  display: flex;
  align-items: center;
}
.fake-btn {
  background: var(--pe-gradient);
  border: none;
  border-radius: 10px;
  height: 56px;
  color: white;
  font-family: Verdana, Geneva, sans-serif;
  font-weight: bold;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* ─── BOARD PICKER ─── */
.board-card {
  background: var(--pe-bg-card);
  border: 1px solid var(--pe-border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: border-color 120ms;
}
.board-card:hover { border-color: var(--pe-cyan-bright); }
.board-num  { font-size: 17px; font-weight: bold; color: var(--pe-text); }
.board-name { font-size: 11px; color: var(--pe-text-muted); margin-top: 2px; }

/* ─── NOTE BOX ─── */
.note-box {
  background: rgba(0,184,255,0.07);
  border: 1px solid rgba(0,184,255,0.2);
  border-radius: 14px;
  padding: 18px 20px;
  max-width: 900px;
}
.note-box h4 {
  font-size: 10px;
  color: var(--pe-cyan-bright);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.note-box p {
  font-size: 13px;
  color: var(--pe-text-sub);
  line-height: 1.7;
}

@media (max-width: 860px) {
  .desktop-frame { min-width: 0; }
  .frames { flex-direction: column; align-items: stretch; }
  .frame-wrap { align-items: center; }
}
</style>
</head>
<body>

<div class="page-header">
  <div class="logo-pill">DartEvent</div>
  <div>
    <h1>Navigation Redesign — Mockup v1</h1>

function topBar(isSubPage, title='', roleKey) {
  const r    = ROLES[roleKey];
  const pill = r.pill;
  const init = roleKey === 'public' ? '' : roleKey[0].toUpperCase();

  const pillHtml = pill
    ? `<span class="role-pill" style="background:${pill.bg};color:${pill.color};border:1px solid ${pill.border};">${pill.label}</span>`
    : '';
  const avatarHtml = roleKey !== 'public'
    ? `<div class="topbar-avatar">${init}</div>`
    : '';

  if (isSubPage) return `
    <div class="topbar">
      <div class="topbar-back">←</div>
      <div class="topbar-spacer" style="text-align:center;"><span class="topbar-title">${title}</span></div>
      ${pillHtml}${avatarHtml}
    </div>`;

  return `
    <div class="topbar">
      <div class="topbar-logo">DartEvent</div>
      <div class="topbar-spacer"></div>
      ${pillHtml}${avatarHtml}
    </div>`;
}

function mobileNav(roleKey, activeIdx) {

        <span class="m-label">${it.label}</span>

    .join('');
  return `<div class="mobile-bottomnav">${items}</div>`;
}

function desktopNav(roleKey, activeIdx) {

        <div class="ref-input-display">D-20</div>
        <button class="ref-act-btn confirm">✓</button>
      </div>

      <div class="ref-exit">← Turnier verlassen</div>
    </div>
  `;
}

// ──────────────────────────────────────────────
//  RENDER
// ──────────────────────────────────────────────
function render() {
  renderMobile();
  renderDesktop();
  renderNote();
}

function renderMobile() {
  const el = document.getElementById('mob');

  if (screen === 'ref-login') {
    el.innerHTML = refLoginScreen();
    return;
  }
  if (screen === 'ref-picker') {
    el.innerHTML = topBar(false, '', role) + refPickerContent();
    return;
  }
  if (screen === 'ref-board') {
    el.innerHTML = refBoardContent();
    return;
  }
  if (screen === 'ref-queue') {
    el.innerHTML = refQueueContent();
    return;
  }

  const isSub  = screen === 'subpage';
  const inner  = isSub ? subpageContent() : homeContent(role);
  el.innerHTML = `
    ${topBar(isSub, 'Turnier-Detail', role)}
    <div class="content-area content-pb" style="flex:1;">${inner}</div>
    ${mobileNav(role, 0)}
  `;
}

function renderDesktop() {
  const el = document.getElementById('dsk');

  if (screen === 'ref-login') {
    el.innerHTML = `<div style="display:flex;flex-direction:column;flex:1;">${refLoginScreen()}</div>`;
    return;
  }
  if (screen === 'ref-picker') {
    el.innerHTML = `
      ${topBar(false, '', role)}
      <div style="flex:1;padding:24px;background:var(--pe-bg);">
        <p style="font-size:10px;color:var(--pe-text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;">Board auswählen</p>
        <div style="max-width:440px;">
          <div class="board-card" style="border-color:var(--pe-danger);opacity:0.7;cursor:not-allowed;"><div style="flex:1;"><div class="board-num">Board 1</div><div class="board-name">Hauptscheibe</div><div style="font-size:11px;color:var(--pe-success);margin-top:3px;">● Müller vs Schmidt</div><div style="font-size:11px;color:var(--pe-danger);margin-top:2px;">🔒 Referee: Huber</div></div><span class="badge" style="background:rgba(255,69,96,0.12);color:var(--pe-danger);border:1px solid rgba(255,69,96,0.3);">Belegt</span></div>
          <div class="board-card" style="border-color:var(--pe-cyan-bright);"><div style="flex:1;"><div class="board-num">Board 2</div><div class="board-name">Nebenraum</div><div style="font-size:11px;color:var(--pe-warning);margin-top:3px;">⏳ Fischer vs Wagner</div><div style="font-size:11px;color:var(--pe-text-muted);margin-top:2px;">Kein Referee</div></div><span class="badge" style="background:rgba(0,184,255,0.12);color:var(--pe-cyan-bright);border:1px solid rgba(0,184,255,0.3);">Frei</span></div>
          <div class="board-card"><div style="flex:1;"><div class="board-num">Board 3</div><div style="font-size:11px;color:var(--pe-text-muted);margin-top:3px;">Kein aktives Spiel</div><div style="font-size:11px;color:var(--pe-text-muted);margin-top:2px;">Kein Referee</div></div><span class="badge" style="background:rgba(90,115,148,0.12);color:var(--pe-text-muted);border:1px solid var(--pe-border);">Frei</span></div>
        </div>
      </div>
    `;
    return;
  }
  if (screen === 'ref-board') {
    el.innerHTML = `<div style="display:flex;flex-direction:column;flex:1;position:relative;">${refBoardContent()}</div>`;
    return;
  }
  if (screen === 'ref-queue') {
    el.innerHTML = `<div style="display:flex;flex-direction:column;flex:1;">${refQueueContent()}</div>`;
    return;
  }

  const isSub = screen === 'subpage';
  const inner = isSub ? subpageContent() : homeContent(role);
  el.innerHTML = `
    ${topBar(isSub, 'Turnier-Detail', role)}
    ${desktopNav(role, 0)}
    <div class="content-area" style="padding:20px 24px;">
      <div style="max-width:760px;margin:0 auto;">${inner}</div>
    </div>
  `;
}

function renderNote() {
  document.getElementById('design-note').textContent =
    (NOTES[role] || {})[screen] || '–';
}

// ──────────────────────────────────────────────
//  CONTROLS
// ──────────────────────────────────────────────
function setRole(r) {
  role = r;
  document.querySelectorAll('[id^="r-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('r-' + r).classList.add('active');
  render();
}

function setScreen(s) {
  screen = s;
  document.querySelectorAll('[id^="s-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('s-' + s).classList.add('active');
  render();
}

// ──────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────
render();
</script>
</body>
</html>
